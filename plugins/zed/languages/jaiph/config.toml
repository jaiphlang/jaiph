name = "Jaiph"
grammar = "jaiph"
# Suffix match, so `.jh` and `*.test.jh` both resolve to this language.
path_suffixes = ["jh", "test.jh"]
line_comments = ["# "]
autoclose_before = ",)]}"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
